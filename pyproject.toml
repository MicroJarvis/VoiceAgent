[project]
name = "voice-agent"
version = "0.1.0"
description = "Offline Qwen-based voice/text agent for local command execution"
requires-python = ">=3.11,<3.15"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]
voice = [
  "sounddevice>=0.4.6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
