tools:
  read_cpu_temp:
    description: Read CPU temperature.
    risk: low
    command: ["/bin/echo", "temp=42.0'C"]
    timeout_seconds: 5
    args_schema: {}

  restart_service:
    description: Restart an allowed local service.
    risk: high
    command: ["/bin/echo", "restart {name}"]
    timeout_seconds: 15
    args_schema:
      name:
        type: enum
        values: ["camera", "music", "voice-agent"]

  explain_no_action:
    description: Explain that no local command was executed.
    risk: low
    execution: noop
    timeout_seconds: 1
    args_schema: {}
